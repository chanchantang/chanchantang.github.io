<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chanson Tang · Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="zoom-wrap">
    <div id="scene-wrap">
      <canvas id="bg-canvas"></canvas>
      <canvas id="hero-canvas"></canvas>
      <canvas id="earth-canvas"></canvas>
      <canvas id="const-canvas"></canvas>
    </div>
  </div>

  <div id="cursor">
    <svg id="cursor-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="10" class="cursor-ring" />
      <circle cx="24" cy="24" r="2.5" class="cursor-core" />
      <circle cx="24" cy="24" r="18" class="cursor-outer" />
    </svg>
  </div>

  <div id="myth-overlay"></div>

  <!-- Floating UI controls -->
  <div id="ui-controls">
    <button id="btn-audio" title="Toggle ambient sound" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 9H5a1 1 0 00-1 1v4a1 1 0 001 1h4l5 4V5L9 9z"/>
        <path class="audio-on" d="M15.5 8.5a5 5 0 010 7M18.5 6a9 9 0 010 12"/>
        <line class="audio-off" x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </button>
    <button id="btn-theme" title="Change theme" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
    <a id="btn-resume" href="/resume.pdf" download title="Download Résumé" aria-label="Download résumé">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 15V3M8 11l4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/>
      </svg>
    </a>
  </div>

  <!-- Theme colour overlay -->
  <div id="theme-overlay"></div>

  <!-- Star name tooltip -->
  <div id="star-tooltip"></div>

  <!-- Cursor trail canvas -->
  <canvas id="trail-canvas"></canvas>

  <!-- Mobile notice -->
  <div id="desktop-notice">✦ Best experienced on desktop</div>

  <!-- Scroll progress indicator -->
  <div id="scroll-progress">
    <div id="sp-track"></div>
    <div id="sp-star">✦</div>
  </div>

  <div class="scroll-container">

    <section class="hero-section">
      <div class="hero-content">
        <p class="hero-tag">SFU CS &nbsp;·&nbsp; Software Engineer</p>
        <h1 class="hero-name">Chanson<br>Tang</h1>
        <p class="hero-subtitle">Building things that matter</p>
        <div class="open-to-work">
          <span class="otw-dot"></span>
          <span class="otw-label">Open to opportunities</span>
        </div>
      </div>
      <div class="hero-scroll-hint">
        <div class="scroll-line"></div>
        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <section class="const-section label-right" id="sec-cassiopeia" data-constellation="cassiopeia">
      <div class="section-label">
        <span class="section-num">I</span>
        <h2>About Me</h2>
      </div>
    </section>

    <section class="const-section label-left" id="sec-scorpius" data-constellation="scorpius">
      <div class="section-label">
        <span class="section-num">II</span>
        <h2>Experience</h2>
      </div>
    </section>

    <section class="const-section label-right" id="sec-orion" data-constellation="orion">
      <div class="section-label">
        <span class="section-num">III</span>
        <h2>Projects</h2>
      </div>
    </section>

    <section class="const-section label-left" id="sec-lyra" data-constellation="lyra">
      <div class="section-label">
        <span class="section-num">IV</span>
        <h2>Skills</h2>
      </div>
    </section>

    <section class="const-section label-center" id="sec-aquarius" data-constellation="aquarius">
      <div class="section-label">
        <span class="section-num">V</span>
        <h2>Contact</h2>
      </div>
    </section>

    <section class="earth-section" id="sec-earth"></section>

  </div>

  <div id="panel-overlay" class="hidden">
    <div id="panel-backdrop"></div>
    <div id="panel-content">
      <button id="panel-close" aria-label="Close panel">✕</button>
      <div id="panel-inner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
